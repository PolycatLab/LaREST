name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting dependencies
        # only the dependencies needed for linting and type checking (CENSO is
        # not needed: LaREST imports it dynamically)
        run: pip install pre-commit ty pytest numpy pandas tqdm rdkit

      - uses: pre-commit/action@v3.0.1
